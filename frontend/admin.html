<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PineTree Chatbot Admin</title>
<link rel="icon" href="/static/logo-icon.png" type="image/png">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("pinetree_theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<link rel="stylesheet" href="/static/chat.css?v=6">
<link rel="stylesheet" href="/static/admin.css?v=4">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
    <a class="brand" href="/" aria-label="Open the chatbot">
      <img src="/static/logo-wordmark.png" alt="PineTree Macro" width="373" height="52">
    </a>

    <section class="side-section">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
        <span class="label">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="theme-label">Dark mode</span>
        </span>
      </button>
    </section>

    <section class="side-section">
      <h2>Chatbot admin</h2>
      <nav class="admin-nav" id="tabs" aria-label="Sections">
        <button class="nav-item active" type="button" data-tab="overview">Overview</button>
        <button class="nav-item" type="button" data-tab="escalations">Escalations</button>
        <button class="nav-item" type="button" data-tab="leads">Leads</button>
        <button class="nav-item" type="button" data-tab="faqs">FAQs</button>
      </nav>
    </section>

    <div class="side-spacer"></div>

    <a class="contact-link" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>
      <span>Open the chatbot</span>
    </a>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <img src="/static/logo-icon.png" alt="" width="28" height="30">
      <strong>Chatbot admin</strong>
    </header>
    <div class="scroll" id="scroll">
      <div class="admin-content" id="view"></div>
    </div>
  </main>
</div>
<script src="/static/admin.js?v=4"></script>
</body>
</html>
